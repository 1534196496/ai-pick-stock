[project]
name = "ai-pick-stock-api"
version = "0.1.0"
description = "个人股票与基金持仓工具 API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.116,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy[asyncio]>=2.0.41,<3",
    "uvicorn[standard]>=0.35,<1",
    "argon2-cffi>=25.1,<26",
    "email-validator>=2.3,<3",
    "httpx>=0.28,<1",
    "akshare>=1.18.94,<2",
    "efinance>=0.5.9,<1",
    "yfinance>=1.7,<2",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "mypy>=1.17,<2",
    "pytest>=8.4,<10",
    "pytest-cov>=6.2,<8",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

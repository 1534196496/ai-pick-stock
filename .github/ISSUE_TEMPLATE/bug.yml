name: 缺陷报告
description: 报告可以稳定复现的功能或界面问题
title: "[缺陷] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。安全漏洞请按 SECURITY.md 私密报告，不要在公开 Issue 中填写凭据、账户或真实持仓数据。
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 登录与账户
        - 持仓
        - 自选
        - 行情与净值
        - 部署与运维
        - 其他
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请提供最小、连续且可重复执行的步骤。
      placeholder: |
        1. 登录后进入……
        2. 选择……
        3. 观察到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: input
    id: observed_at
    attributes:
      label: 发生时间与数据时间
      description: 请同时注明时区；涉及行情时注明页面显示的数据时间。
      placeholder: "2026-08-24 15:10 Asia/Shanghai；行情时间 15:00"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 版本或提交、部署方式、操作系统、浏览器及相关配置；请脱敏。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志与验证证据
      description: 可提供已脱敏日志、截图、失败测试或最小样例，不要粘贴秘密和个人数据。
  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，并确认没有重复报告。
          required: true
        - label: 我已移除密码、Token、Cookie、个人信息和真实持仓数据。
          required: true
        - label: 这不是需要私密报告的安全漏洞。
          required: true

name: 功能建议
description: 提议一个边界清晰、具有用户价值的改进
title: "[功能] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请先说明要解决的问题，而不是直接指定实现。项目第一优先级是简单、正确、可维护。
  - type: textarea
    id: problem
    attributes:
      label: 用户问题
      description: 谁在什么场景遇到什么困难？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果与验收方式
      description: 请使用可观察、可验证的结果描述成功标准。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 建议范围
      description: 分别说明本次包含和明确不包含的内容。
      placeholder: |
        包含：……
        不包含：……
    validations:
      required: true
  - type: dropdown
    id: compatibility
    attributes:
      label: 兼容性影响
      options:
        - 不影响现有行为
        - 可能影响 API、数据库或用户流程
        - 明确属于 Breaking Change
        - 尚不确定，需要共同评估
    validations:
      required: true
  - type: textarea
    id: migration
    attributes:
      label: 迁移与回滚设想
      description: 若可能不兼容，请说明旧用户、旧数据和旧客户端如何迁移及回滚。
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，并确认没有重复建议。
          required: true
        - label: 此建议不宣称保证收益，也不替用户作投资决策。
          required: true

[project]
name = "ai-pick-stock"
version = "0.1.0"
description = "A-share data collector and explainable stock research assistant"
requires-python = ">=3.11"
dependencies = [
  "akshare>=1.17",
  "beautifulsoup4>=4.12",
  "numpy>=2.0",
  "pandas>=2.2",
  "requests>=2.31",
  "psutil>=6.0",
  "exchange-calendars>=4.8",
  "streamlit>=1.40",
  "yfinance>=0.2.65",
]

[project.optional-dependencies]
ai = ["openai>=1.60"]
dev = ["pytest>=8.0"]

[project.scripts]
stock-picker = "stock_picker.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
